name: Compile Resume

on:
  push:
    branches: [main]
    paths:
      - 'resume/formats/**.typ'
      - 'resume/data.json'

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Compile all formats
        run: |
          typst compile --root . resume/formats/basic-resume/resume.typ   resume/formats/basic-resume/resume.pdf
          typst compile --root . resume/formats/modernpro-cv/resume.typ   resume/formats/modernpro-cv/resume.pdf
          typst compile --root . resume/formats/custom/resume.typ         resume/formats/custom/resume.pdf

      - name: Promote modernpro-cv as primary download
        run: cp resume/formats/modernpro-cv/resume.pdf resume/Resume_Vikash_Sinha.pdf

      - name: Commit compiled PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume/
          git diff --cached --quiet || git commit -m "chore: recompile resume PDFs"
          git push
